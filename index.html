['إدخال نتائج التكسير',`<ol><li>من «إدخال بيانات» اختر «إدخال نتائج تكسير».</li><li>اختر الأوردر وعمر التكسير (7 أو 28 يوم).</li><li>اختر أبعاد العينة (مكعب أو أسطوانة أو كمرة، ويمكن إضافة أبعاد أخرى بزر +) وأدخل حمل الكسر لكل عينة <b>بالكيلو نيوتن</b>.</li><li>يحسب البرنامج المقاومة بالكجم/سم² ويقارنها بالمقاومة المطلوبة ويحكم بالمطابقة (المتوسط ≥ المطلوب ولا تقل عينة عن 85%).</li><li>يمكن تعديل أي نتيجة محفوظة بزر <b>تعديل</b>.</li></ol>`],
['إدخال متابعة الصب',`<p>المتابعة لها شاشتان تُبدّل بينهما بالزرين أعلى الصفحة: <b>متابعة المحطة</b> و<b>متابعة الموقع</b>. اختر الأوردر أولًا؛ التاريخ يؤخذ من الأوردر تلقائيًا.</p><ul><li><b>المحطة:</b> أدخل وقت الخروج، واختر رقم العربية والسائق من القائمتين (والزر + لإضافة جديد)، ثم الكمية وعدد المكعبات والهبوط والإضافات وحرارة الخرسانة، واحفظ. كل عربية جديدة تُضاف تحت التي قبلها في نفس الجدول.</li><li><b>الموقع:</b> تُضاف العربيات هنا تلقائيًا من المحطة (رقم العربية والسائق والكمية ثابتة). اضغط «تعديل» بجوار العربية لإدخال وقت الوصول وبداية ونهاية الصب والهبوط.</li><li>الشريط أعلى النموذج يعرض كمية الأوردر والمصبوب والمتبقي (مصبوب المحطة أو مصبوب الموقع حسب الشاشة)، ويظهر تحذير إذا زادت الكمية عن الأوردر.</li><li>زر الحذف يمسح العربية نهائيًا من الشيتات والتقارير.</li><li>أسفل الصفحة يظهر جدول المتابعة بشكل الشيت.</li></ul>`],
['الاختبارات',`<ul><li>من «الاختبارات» اختر الاختبار (ضغط المكعبات، تدرج الركام، رطوبة الركام، الوزن النوعي والامتصاص، لوس أنجلوس، المكافئ الرملي، التفلطح والاستطالة، تصميم الخلطة وغيرها).</li><li>داخل كل اختبار زر <b>شرح</b> يوضح الغرض والطريقة والحساب ومعيار القبول.</li><li>أدخل القيم ويظهر الحساب والنتيجة (✓ / ✗) مباشرة، ثم احفظ الاختبار.</li><li>الاختبارات المحفوظة تجدها بنفس الصفحة ويمكن تصفيتها بنوع الاختبار.</li></ul>`],
['الأدوات',`<ul><li><b>ليبل المكعبات:</b> ليبل لكل مكعب، ليبلات الموقع باسم فني الموقع وليبلات المحطة باسم فني المحطة، مع شعار الشركة.</li><li><b>تكسير اليوم (7 / 28 يوم):</b> اختر الفترة من يوم إلى يوم فتظهر العناصر التي يحين تكسيرها (تاريخ الصب + العمر) مع العدد، ويمكن طباعتها.</li><li><b>درجة حرارة الخرسانة المتوقعة:</b> أدخل أوزان وحرارة الأسمنت والمياه والركام والجو.</li><li><b>الاستهلاك الشهري والتراكمي:</b> استهلاك الخامات من الأوردرات.</li></ul>`],
['التقارير',`<ul><li><b>متابعة الأوردرات:</b> حالة كل أوردر ونتائجه.</li><li><b>متابعة المحطة / متابعة الموقع:</b> جدول لكل أوردر بشكل الشيت، مع اختيار الأوردر وفترة التاريخ.</li><li><b>ملخص المتابعات:</b> صف لكل أوردر كامل (المحطة والموقع). الجدول يتحرك يمينًا ويسارًا لقراءة كل الأعمدة.</li><li><b>تقارير تكسير 7 و28 يوم:</b> شهادة بصفحة لكل أوردر.</li><li><b>اللوج، الانحراف المعياري، Compressive Strength، التحليلات، صفحة الاستهلاك.</b></li><li><b>حفظ PDF:</b> اضغط الزر ثم اختر «حفظ كـ PDF» من نافذة الطباعة. <b>حفظ Excel:</b> يحمّل الملف مباشرة. الزران لمن لديه صلاحية التصدير والطباعة.</li></ul>`],
['لوحة التحكم (للمبرمج / الإدارة)',`<p>من شاشة الدخول اختر «لوحة التحكم» وأدخل كلمة مرورها، وتشمل:</p><ul><li>إضافة شركة (الاسم والقطاع واللوجو) وإضافة محطة وإضافة خلطة بمكوناتها، وكلها قابلة للتعديل.</li><li>قبول الأعضاء الجدد وتحديد صلاحيات كل عضو والمطلوب منه.</li><li>إرسال رسالة لجميع العاملين، وتغيير كلمة المرور.</li><li><b>شرح الاختبارات:</b> تعديل نص الشرح الذي يظهر بزر «شرح».</li><li>نسخة احتياطية (تصدير واستيراد كل البيانات) وإزالة شركة أو محطة.</li></ul>`],
['حفظ البيانات ونصائح',`<ul><li>البيانات تُحفظ على جهازك، وتُرفع للشيت عند الاتصال. خذ نسخة احتياطية من لوحة التحكم بانتظام.</li><li>إذا ظهر تنبيه «لم تُرفع للشيت» فاتصل بالإنترنت وحدّث قبل تسجيل الخروج.</li><li>الأزرار بعلامة <b>+</b> تضيف عنصرًا جديدًا للقائمة بدل الكتابة كل مرة.</li><li>للمشاكل أو الاقتراحات: القائمة الجانبية ← المبرمج.</li></ul>`]];

function bellSvg(m){const mu=m.mean,sd=m.sd,fck=m.g?m.g*10:null,W=340,H=175,Lm=12,Rm=12,Tm=16,B=34,base=H-B;

 const X=x=>nn(Lm+(x-lo)/(hi-lo)*(W-Lm-Rm),1),pdf=x=>Math.exp(-((x-mu)**2)/(2*sd*sd))/(sd*Math.sqrt(2*Math.PI)),pk=pdf(mu),Y=y=>nn(Tm+(1-y/pk)*(H-Tm-B),1),pts=[];
 for(let i=0;i<=80;i++){const x=lo+(hi-lo)*i/80;pts.push(X(x)+','+Y(pdf(x)))}
 let g=`<polygon fill="#ea6a0a" fill-opacity=".18" stroke="none" points="${X(lo)},${base} ${pts.join(' ')} ${X(hi)},${base}"/><polyline fill="none" stroke="#ea6a0a" stroke-width="2.2" points="${pts.join(' ')}"/><line x1="${Lm}" x2="${W-Rm}" y1="${base}" y2="${base}" stroke="currentColor" opacity=".4"/>`;
 g+=`<line x1="${X(mu)}" x2="${X(mu)}" y1="${Tm}" y2="${base}" stroke="#ea6a0a" stroke-width="1.6"/>`;
 [mu-sd,mu+sd].forEach(x=>g+=`<line x1="${X(x)}" x2="${X(x)}" y1="${Tm}" y2="${base}" stroke="#888" stroke-dasharray="3 3"/>`);
 if(fck!=null)g+=`<line x1="${X(fck)}" x2="${X(fck)}" y1="${Tm}" y2="${base}" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 3"/><text x="${X(fck)}" y="${Tm-4}" font-size="9" text-anchor="middle" fill="#dc2626">${fck}</text>`;
 [mu-2*sd,mu,mu+2*sd].forEach(x=>g+=`<text x="${X(x)}" y="${H-18}" font-size="9" text-anchor="middle" fill="currentColor">${Math.round(x)}</text>`);
 (m.it||[]).forEach(y=>g+=`<circle cx="${X(y.x)}" cy="${base-5}" r="3" fill="#1d4670" fill-opacity=".8"/>`);
 g+=`<text x="${W/2}" y="${H-4}" font-size="9" text-anchor="middle" fill="currentColor">المقاومة (كجم/سم²)</text>`;
 return `<div style="margin:10px 0"><b>${esc(m.m)}</b> — n=${m.n} · المتوسط ${Math.round(mu)} · σ ${sd.toFixed(1)}${fck!=null?' · المطلوب '+fck:''}<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:480px;display:block;margin:4px auto;direction:ltr">${g}</svg></div>`}

 const co=D.co.find(c=>c.id===myCo())||{n:'الشركة'},ps=D.us.filter(u=>u.ok===false&&mgCan(u)),ms=D.us.filter(u=>u.ok!==false&&mgCan(u));
 let h=`<div class="card">${sh('users','أعضاء «'+esc(co.n)+'»')}<p class="mt" style="margin:0">اقبل طلبات الانضمام لمحطات شركتك، وحدّد صلاحيات كل عضو، أو احذفه. لا تظهر لك بيانات الشركات الأخرى.</p></div>`;

/* --- إحصاء شامل للاختبارات + كرف التدرج المجمّع --- */
const pnum=x=>{const t=String(x==null?'':x).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/,/g,'');return /^\s*-?\d+(\.\d+)?\s*$/.test(t)?+t:null};
const tVerdict=r=>{const v=(r.rows||[]).map(a=>String(a[1]));if(v.some(t=>/غير مطابق|❌|✖/.test(t)))return 0;if(v.some(t=>/مطابق|✅|✔/.test(t)))return 1;return null};
const grKey=r=>{const ty=((r.rows||[]).find(a=>a[0]==='نوع التدرج')||[])[1]||'';return r.t+(r.mat?' — '+r.mat:'')+(ty?' — '+ty:'')};
function curveMulti(G){const P0=G[0].pc[0],W=340,Hh=230,L=34,Rr=10,Tt=14,B=36,mx=Math.log(P0[0][0]),mn=Math.log(P0[P0.length-1][0]),X=z=>nn(L+(mx-Math.log(z))/(mx-mn)*(W-L-Rr),1),Y=p=>nn(Tt+(100-p)/100*(Hh-Tt-B),1),pl=(A,c,w,d,o)=>A.length>1?`<polyline fill="none" stroke="${c}" stroke-width="${w}" ${d?'stroke-dasharray="5 3"':''} ${o?'opacity="'+o+'"':''} points="${A.map(([z,p])=>X(z)+','+Y(p)).join(' ')}"/>`:'';
 let g='';[0,25,50,75,100].forEach(p=>g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(p)}" y2="${Y(p)}" stroke="currentColor" opacity=".18"/><text x="${L-4}" y="${+Y(p)+4}" font-size="10" text-anchor="end" fill="currentColor">${p}</text>`);
 P0.forEach(([z])=>g+=`<line x1="${X(z)}" x2="${X(z)}" y1="${Tt}" y2="${Hh-B}" stroke="currentColor" opacity=".12"/><text x="${X(z)}" y="${Hh-B+13}" font-size="9" text-anchor="middle" fill="currentColor">${z}</text>`);
 if(G.length>1){const mxv=P0.map(([z],i)=>[z,Math.max(...G.map(r=>r.pc[0][i][1]))]),mnv=P0.map(([z],i)=>[z,Math.min(...G.map(r=>r.pc[0][i][1]))]);g+=`<polygon fill="#2563eb" fill-opacity=".12" stroke="none" points="${mxv.concat(mnv.slice().reverse()).map(([z,p])=>X(z)+','+Y(p)).join(' ')}"/>`}
 G.forEach(r=>g+=pl(r.pc[0],'#7b8794',1,0,.55));
 g+=pl(G[0].pc[1]||[],'#dc2626',1.8,1)+pl(G[0].pc[2]||[],'#16a34a',1.8,1);
 const M=P0.map(([z],i)=>[z,avg(G.map(r=>r.pc[0][i][1]))]);
 g+=pl(M,'#ea6a0a',3,0)+M.map(([z,p])=>`<circle cx="${X(z)}" cy="${Y(p)}" r="3.5" fill="#ea6a0a"/>`).join('');
 return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="max-width:520px;display:block;margin:6px auto;direction:ltr"><text x="4" y="9" font-size="10" fill="currentColor">% المار</text>${g}<text x="${W/2}" y="${Hh-4}" font-size="10" text-anchor="middle" fill="currentColor">مقاس المنخل (مم) – مقياس لوغاريتمي</text></svg>`}
function grStatTable(G){const P0=G[0].pc[0],lo={},hi={};(G[0].pc[1]||[]).forEach(([z,p])=>lo[z]=p);(G[0].pc[2]||[]).forEach(([z,p])=>hi[z]=p);
 return '<div class="sc"><table style="white-space:nowrap"><tr><th>المنخل (مم)</th><th>متوسط المار %</th><th>أدنى</th><th>أقصى</th><th>الحد الأدنى</th><th>الحد الأعلى</th><th>عينات خارج الحدود</th></tr>'+P0.map(([z],i)=>{const v=G.map(r=>r.pc[0][i][1]),l=lo[z],h=hi[z],out=l==null?'—':v.filter(x=>x<l-1e-9||x>h+1e-9).length;return `<tr><td>${z}</td><td>${nn(avg(v),1)}</td><td>${nn(Math.min(...v),1)}</td><td>${nn(Math.max(...v),1)}</td><td>${l==null?'—':l}</td><td>${h==null?'—':h}</td><td>${out}</td></tr>`}).join('')+'</table></div>'}
function tstV(emb){const L=D.tr.filter(x=>ccodes().includes(x.c));
 const head=`<div class="card noprint">${sh('chart','إحصاء شامل للاختبارات')}<p class="mt" style="margin:0">ملخص كل الاختبارات المحفوظة: العدد والمطابقة وإحصاء القيم، مع كرف التدرج المجمّع.</p>${me.perm.includes('x')?`<button class="full" onclick="window.print()">${I('prn')} طباعة / حفظ PDF</button>`:''}<button class="full g" onclick="tab='gst';mainV();scrollTo(0,0)">${I('chart',18)} إحصائيات التدرج الشامل</button><button class="full g" onclick="tab='t';ts=null;mainV();scrollTo(0,0)">رجوع للاختبارات</button></div>`;
 if(!L.length)return (emb?'':head)+`<div class="card"><p class="mt" style="margin:0">لا توجد اختبارات محفوظة.</p></div>`;
 const T=[...new Set(L.map(x=>x.t))].sort(),e=esc;
 const sumRows=T.map(t=>{const l=L.filter(x=>x.t===t),ds=l.map(x=>x.d).filter(Boolean).sort(),vd=l.map(tVerdict),ok=vd.filter(x=>x===1).length,bad=vd.filter(x=>x===0).length,j=ok+bad;return `<tr><td style="text-align:start">${e(t)}</td><td>${l.length}</td><td>${ds.length?e(fmtD(ds[0])):'—'}</td><td>${ds.length?e(fmtD(ds[ds.length-1])):'—'}</td><td>${j?ok:'—'}</td><td>${j?bad:'—'}</td><td>${j?Math.round(ok/j*100)+'%':'—'}</td></tr>`}).join('');
 const okAll=L.map(tVerdict),oa=okAll.filter(x=>x===1).length,ba=okAll.filter(x=>x===0).length;
 let h=(emb?'':plg()+head)+`<div class="card sc">${sh('clip','ملخص الاختبارات ('+L.length+' اختبار)')}<table style="white-space:nowrap"><tr><th>الاختبار</th><th>العدد</th><th>أول عينة</th><th>آخر عينة</th><th>مطابق</th><th>غير مطابق</th><th>نسبة المطابقة</th></tr>${sumRows}<tr style="background:var(--bg)"><td><b>الإجمالي</b></td><td><b>${L.length}</b></td><td>—</td><td>—</td><td><b>${oa}</b></td><td><b>${ba}</b></td><td><b>${oa+ba?Math.round(oa/(oa+ba)*100)+'%':'—'}</b></td></tr></table></div>`;
 T.forEach(t=>{const l=L.filter(x=>x.t===t),M=new Map();l.forEach(r=>(r.rows||[]).forEach(a=>{const n=pnum(a[1]);if(n==null)return;const k=String(a[0]),z=M.get(k)||{u:a[2]||'',v:[]};z.v.push(n);M.set(k,z)}));
  if(!M.size)return;
  h+=`<div class="card sc">${sh('chart',e(t)+' — إحصاء القيم')}<table style="white-space:nowrap"><tr><th>القيمة</th><th>العدد</th><th>المتوسط</th><th>أدنى</th><th>أقصى</th><th>الانحراف</th><th>الوحدة</th></tr>${[...M].map(([k,z])=>{const n=z.v.length,mu=avg(z.v),sd=n>1?Math.sqrt(z.v.reduce((a,x)=>a+(x-mu)**2,0)/(n-1)):null;return `<tr><td style="text-align:start">${e(k)}</td><td>${n}</td><td>${nn(mu,2)}</td><td>${nn(Math.min(...z.v),2)}</td><td>${nn(Math.max(...z.v),2)}</td><td>${sd==null?'—':nn(sd,2)}</td><td>${e(z.u)}</td></tr>`}).join('')}</table></div>`});
 const gm=new Map();L.filter(r=>r.pc&&r.tb&&r.pc[0]&&r.pc[0].length).forEach(r=>{const k=grKey(r),a=gm.get(k)||[];if(!a.length||(a[0].pc[0].length===r.pc[0].length&&a[0].pc[0].every((p,i)=>p[0]===r.pc[0][i][0])))a.push(r);gm.set(k,a)});
 gm.forEach((G,k)=>{h+=`<div class="card">${sh('chart','كرف التدرج المجمّع — '+e(k))}<p class="mt" style="margin:0">${G.length} عينة · الرمادي = كل عينة · البرتقالي = المتوسط · الأحمر/الأخضر = حدود المواصفة</p>${curveMulti(G)}${grStatTable(G)}</div>`});
 return h}

/* --- إحصائيات التدرج الشامل --- */
let gsK='',gsF='',gsT='',gsQ='';
const gstBtn=()=>`<button class="full g" style="margin:0 0 12px" onclick="tab='gst';msg='';mainV();scrollTo(0,0)">${I('chart',18)} إحصائيات التدرج الشامل</button>`;
function gstV(emb){const all=D.tr.filter(x=>ccodes().includes(x.c)&&x.pc&&x.tb&&x.pc[0]&&x.pc[0].length),keys=[...new Set(all.map(grKey))].sort(),e=esc;
 const hd=emb?`<div class="card noprint">`:`<div class="card noprint">${sh('chart','إحصائيات التدرج الشامل')}<p class="mt" style="margin:0">تحليل كل اختبارات التدرج المحفوظة: متوسط المار وأدنى وأقصى وانحراف ومعامل اختلاف عند كل منخل، ونسبة المطابقة، وكرف مجمّع بنطاق القيم.</p>`;
 if(!keys.length)return hd+`${emb?'':`<button class="full g" onclick="tab='t';ts=null;mainV()">رجوع للاختبارات</button>`}</div><div class="card"><p class="mt" style="margin:0">لا توجد اختبارات تدرج محفوظة بعد.</p></div>`;

 const pq=r=>r.mp||'بدون محجر',base=all.filter(r=>grKey(r)===gsK),qs=[...new Set(base.map(pq))].sort();if(gsQ&&!qs.includes(gsQ))gsQ='';
 let G=base.filter(r=>(!gsF||(r.d||'')>=gsF)&&(!gsT||(r.d||'')<=gsT)&&(!gsQ||pq(r)===gsQ));
 const zk=r=>r.pc[0].map(p=>p[0]).join(','),z0=G.length?zk(G[0]):'';G=G.filter(r=>zk(r)===z0);
 const ctl=hd+`<label>نوع التدرج</label><select onchange="gsK=this.value;gsQ='';rm()">${keys.map(k=>`<option value="${e(k)}"${k===gsK?' selected':''}>${e(k)} (${all.filter(r=>grKey(r)===k).length})</option>`).join('')}</select><div class="r2"><div><label>من تاريخ</label><input type="date" value="${e(gsF)}" onchange="gsF=this.value;rm()"></div><div><label>إلى تاريخ</label><input type="date" value="${e(gsT)}" onchange="gsT=this.value;rm()"></div></div><label>المحجر</label><select onchange="gsQ=this.value;rm()"><option value="">كل المحاجر</option>${qs.map(q=>`<option${q===gsQ?' selected':''}>${e(q)}</option>`).join('')}</select>${emb?'':`${me.perm.includes('x')?`<button class="full" onclick="window.print()">${I('prn')} طباعة / حفظ PDF</button>`:''}<button class="full g" onclick="tab='t';ts=null;mainV();scrollTo(0,0)">رجوع للاختبارات</button>`}</div>`;
 if(!G.length)return (emb?'':plg())+ctl+`<div class="card"><p class="mt" style="margin:0">لا توجد عينات في هذه الفترة/المحجر.</p></div>`;
 const P0=G[0].pc[0],lo={},hi={};(G[0].pc[1]||[]).forEach(([z,p])=>lo[z]=p);(G[0].pc[2]||[]).forEach(([z,p])=>hi[z]=p);
 const okR=r=>r.pc[0].every(([z,p])=>(lo[z]==null||p>=lo[z]-1e-9)&&(hi[z]==null||p<=hi[z]+1e-9)),hasL=Object.keys(lo).length||Object.keys(hi).length,n=G.length,okN=G.filter(okR).length;
 const sdv=a=>{const m=avg(a);return a.length>1?Math.sqrt(a.reduce((z,x)=>z+(x-m)**2,0)/(a.length-1)):null};

 const tb=`<div class="sc"><table style="white-space:nowrap;margin-top:10px"><tr><th>المنخل (مم)</th><th>المتوسط</th><th>أدنى</th><th>أقصى</th><th>الانحراف</th><th>CV%</th><th>حد أدنى</th><th>حد أعلى</th><th>خارج الحدود</th></tr>${P0.map(([z],i)=>{const v=G.map(r=>r.pc[0][i][1]),m=avg(v),s2=sdv(v),l=lo[z],h=hi[z],out=(l==null&&h==null)?null:v.filter(x=>(l!=null&&x<l-1e-9)||(h!=null&&x>h+1e-9)).length;return `<tr><td>${z}</td><td>${nn(m,1)}</td><td>${nn(Math.min(...v),1)}</td><td>${nn(Math.max(...v),1)}</td><td>${s2==null?'—':nn(s2,2)}</td><td>${s2==null||!m?'—':nn(s2/m*100,1)}</td><td>${l==null?'—':l}</td><td>${h==null?'—':h}</td><td>${out==null?'—':out+' ('+Math.round(out/n*100)+'%)'}</td></tr>`}).join('')}</table></div>`;
